<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appoteka — Obrt za IT usluge</title>
<meta name="description" content="Appoteka, obrt za IT usluge. vl. Maja Jurinić, Samobor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08090a;
    --ink: #3a3d41;
    --muted: #46494e;
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --display: 'Unbounded', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    height:100%;
    overflow-x: hidden;
  }

  body{
    min-height: 100svh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  main{
    display:flex;
    flex-direction: column;
    align-items:center;
    padding: 24px;
    text-align:center;
  }

  .titleGroup{
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .word{
    display:flex;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2.6rem, 7vw, 4rem);
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .word span{
    display:inline-block;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.6s ease-out forwards;
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0); }
  }

  .tagline{
    font-family: var(--sans);
    font-weight: 500;
    font-size: clamp(0.6rem, 1.3vw, 0.72rem);
    letter-spacing: 0.02em;
    color: #52565b;
    opacity: 0;
    margin-top: -42px;
    animation: fadeUp 0.8s ease-out 0.9s forwards;
  }

  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  footer{
    position: fixed;
    right: clamp(16px, 4vw, 40px);
    bottom: clamp(16px, 4vw, 40px);
    text-align: right;
    font-family: var(--sans);
    font-weight: 500;
    font-size: clamp(0.6rem, 1.3vw, 0.72rem);
    letter-spacing: 0.02em;
    line-height: 1.6;
    color: #52565b;
    opacity: 0;
    animation: fadeUp 0.8s ease-out 1.1s forwards;
  }
  footer strong{
    color: #52565b;
    font-weight: 500;
  }

  @media (max-width: 520px){
    body{
      flex-direction: column;
      padding: 40px 0;
    }
    footer{
      position: static;
      margin-top: 8px;
      text-align: center;
    }
    main{ padding-bottom: 8px; }
    .tagline{
      margin-top: -26px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      animation-delay: 0s !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <main>
    <div class="titleGroup">
      <h1 class="word" aria-label="Appoteka">
        <span style="animation-delay:0.20s">A</span><span style="animation-delay:0.25s">P</span><span style="animation-delay:0.30s">P</span><span style="animation-delay:0.35s">O</span><span style="animation-delay:0.40s">T</span><span style="animation-delay:0.45s">E</span><span style="animation-delay:0.50s">K</span><span style="animation-delay:0.55s">A</span>
      </h1>

      <p class="tagline">Obrt za IT usluge</p>
    </div>
  </main>

  <footer>
    <strong>vl. Maja Jurinić</strong><br>
    Samobor, Ulica Većeslava Kolara 17a<br>
    10430 Samobor, Hrvatska
  </footer>

</body>
</html>
