    overflow-x: hidden;
  }

  body{
    background-image:
      radial-gradient(55% 45% at 50% 44%, rgba(129,140,248,0.10), transparent 70%),
      radial-gradient(35% 30% at 58% 50%, rgba(94,234,212,0.06), transparent 70%);
    min-height: 100svh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  main{
    display:flex;
    flex-direction: column;
    align-items:center;
    padding: 24px;
    text-align:center;
  }

  .titleGroup{
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .word{
    display:flex;
    align-items: baseline;
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2.4rem, 7.5vw, 4.6rem);
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--logo);
  }
  .word span{
    display:inline-block;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.6s ease-out forwards;
  }
  .word .glyph{
    display: inline-flex;
    margin: 0 0.05em;
  }
  .word .glyph svg{
    display: block;
    height: 0.7em;
    width: auto;
    overflow: visible;
    filter: drop-shadow(0 0 0.35em rgba(94,234,212,0.35));
  }

  .word .cursor{
    animation: blink 1.6s ease-in-out 1.4s infinite;
  }

  @keyframes blink{
    0%, 45%{ opacity: 1; }
    60%, 85%{ opacity: 0.1; }
    100%{ opacity: 1; }
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0); }
  }

  .tagline{
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 400;
    font-size: clamp(0.72rem, 1.5vw, 0.9rem);
    letter-spacing: 0.04em;
    text-transform: lowercase;
    color: #c6cbd2;
    opacity: 0;
    margin: 16px 0 0;
    padding-right: 0;
    animation: fadeUp 0.8s ease-out 0.9s forwards;
  }

  .tagline .it{
    color: inherit;
  }

  .tagline .slash{
    margin-right: 0.35em;
    background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- Footer ---------- */
  footer{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0 clamp(20px, 5vw, 56px) clamp(28px, 5vw, 56px);
    opacity: 0;
    animation: fadeUp 0.8s ease-out 1.1s forwards;
  }

  .footInner{
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    padding-top: 26px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px clamp(14px, 4vw, 56px);
    font-weight: 400;
    font-size: clamp(0.68rem, 1.2vw, 0.78rem);
    line-height: 1.7;
    letter-spacing: 0.01em;
    color: var(--value);
  }

  .footInner::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(94,234,212,0.55) 0%,
      rgba(129,140,248,0.35) 30%,
      rgba(255,255,255,0.06) 65%,
      transparent 100%);
  }

  .col{ min-width: 0; }

  .label{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-weight: 500;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #9aa1ab;
  }

  .col strong{
    display: block;
    font-weight: 500;
    color: var(--value-hi);
  }

  .col a{
    color: var(--value-hi);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .col a:hover,
  .col a:focus-visible{
    color: #a3d9d0;
    outline: none;
  }

  .copy{
    grid-column: 1 / -1;
    margin: 10px 0 0;
    text-align: right;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    color: #7d848d;
  }

  .line{
    display: block;
  }
  @media (min-width: 1000px){
    .line{ white-space: nowrap; }
  }

  @media (max-width: 520px){
    body{
      flex-direction: column;
      justify-content: center;
      padding: 40px 0 0;
    }
    main{ padding-bottom: 32px; }
    .tagline{ margin-top: 14px; }

    footer{
      position: static;
      width: 100%;
      padding: 0 24px 32px;
    }
    .footInner{
      grid-template-columns: 1fr;
      gap: 22px;
      text-align: left;
    }
    .line{ white-space: normal; }
    .copy{ text-align: left; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      animation-delay: 0s !important;
      transition-duration: 0.01ms !important;
    }
    .word .cursor{ animation: none !important; opacity: 1; }
  }
</style>
</head>
